name: Build and Push Afran Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry-dba221617d-afran-allocation.apps.ir-central1.arvancaas.ir
  FRONTEND_IMAGE: registry-dba221617d-afran-allocation.apps.ir-central1.arvancaas.ir/afran-allocation-frontend:0.1.0

jobs:
  build:
    name: Build and push Frontend 0.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify actual frontend root
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test -f next.config.ts
          echo "Frontend root contract: PASS"
          node -e "const p=require('./package.json'); console.log(p.name, p.version)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Arvan Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: ${{ env.FRONTEND_IMAGE }}
