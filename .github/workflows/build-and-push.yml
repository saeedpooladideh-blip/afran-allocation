name: Build and Push Afran Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afran-allocation-frontend-image
  cancel-in-progress: false

env:
  REGISTRY: registry-dba221617d-afran-allocation.apps.ir-central1.arvancaas.ir
  FRONTEND_IMAGE: registry-dba221617d-afran-allocation.apps.ir-central1.arvancaas.ir/afran-allocation-frontend:0.1.0

jobs:
  build-and-push:
    name: Build and push Frontend 0.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend source
        run: |
          test -f frontend/package.json
          test -f Dockerfile.frontend
          echo "Frontend source verification: PASS"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Arvan Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

      - name: Publish image digest
        run: |
          echo "Frontend image pushed:"
          echo "${{ env.FRONTEND_IMAGE }}"
          echo "Digest:"
          echo "${{ steps.frontend.outputs.digest }}"
